name: Alertas chollos Amazon

on:
  schedule:
    - cron: "17 * * * *"   # vigilante: si el bot estuviera parado, lo arranca
  workflow_dispatch:
    inputs:
      modo:
        description: "normal o diagnostico"
        default: "diagnostico"

permissions:
  contents: write
  actions: write

concurrency:
  group: alertas-${{ github.event.inputs.modo == 'diagnostico' && 'diagnostico' || 'bot' }}
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Bot de chollos
        run: python3 bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESCUENTO_MIN: ${{ vars.DESCUENTO_MIN }}
          UMBRAL_CHOLLAZOS: ${{ vars.UMBRAL_CHOLLAZOS }}
          EXCLUIR: ${{ vars.EXCLUIR }}
          FEEDS: ${{ vars.FEEDS }}
          MODO: ${{ github.event.inputs.modo || 'normal' }}
